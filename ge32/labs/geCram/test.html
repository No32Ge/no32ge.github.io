<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISeeU摄像头插件测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 20px;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .panel h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #3498db;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .panel h2 svg {
            width: 24px;
            height: 24px;
            fill: #3498db;
        }
        
        .control-group {
            margin-bottom: 25px;
        }
        
        .control-group h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #2ecc71;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }
        
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .btn {
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #eee;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 140px;
            justify-content: center;
        }
        
        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f39c12, #e67e22);
        }
        
        .status {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.5;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .status-line {
            margin-bottom: 5px;
            padding: 5px;
            border-radius: 4px;
        }
        
        .status-line.success {
            background: rgba(46, 204, 113, 0.2);
            border-left: 3px solid #2ecc71;
        }
        
        .status-line.error {
            background: rgba(231, 76, 60, 0.2);
            border-left: 3px solid #e74c3c;
        }
        
        .status-line.info {
            background: rgba(52, 152, 219, 0.2);
            border-left: 3px solid #3498db;
        }
        
        .config-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .config-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .config-item label {
            font-size: 14px;
            color: #aaa;
        }
        
        .config-item input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }
        
        .config-item input:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .media-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        
        .media-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            transition: transform 0.2s;
        }
        
        .media-item:hover {
            transform: translateY(-3px);
        }
        
        .media-item img,
        .media-item video {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
        }
        
        .media-item-info {
            padding: 8px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }
        
        .media-item-actions {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            gap: 5px;
        }
        
        .delete-media {
            background: rgba(231, 76, 60, 0.9);
            border: none;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .empty-message {
            text-align: center;
            color: #777;
            padding: 20px;
            grid-column: 1 / -1;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #777;
            font-size: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .camera-icon, .video-icon, .config-icon, .media-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ISeeU摄像头插件测试</h1>
            <p class="subtitle">测试ISeeU插件的所有功能，包括摄像头控制、拍照录像和媒体管理</p>
        </header>
        
        <div class="content">
            <div class="left-panel">
                <div class="panel">
                    <h2>
                        <svg class="camera-icon" viewBox="0 0 24 24">
                            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                            <path d="M20 4h-3.17l-1.24-1.35A1 1 0 0 0 15 2H9a1 1 0 0 0-.59.18L7.17 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-8 13a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
                        </svg>
                        摄像头控制
                    </h2>
                    
                    <div class="control-group">
                        <h3>基本控制</h3>
                        <div class="buttons">
                            <button class="btn btn-primary" id="startCamera">
                                <svg class="camera-icon" viewBox="0 0 24 24">
                                    <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                                    <path d="M20 4h-3.17l-1.24-1.35A1 1 0 0 0 15 2H9a1 1 0 0 0-.59.18L7.17 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-8 13a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
                                </svg>
                                启动摄像头
                            </button>
                            <button class="btn btn-danger" id="stopCamera" disabled>
                                <svg class="camera-icon" viewBox="0 0 24 24">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
                                </svg>
                                停止摄像头
                            </button>
                            <button class="btn btn-warning" id="switchCamera" disabled>
                                <svg class="camera-icon" viewBox="0 0 24 24">
                                    <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
                                </svg>
                                切换摄像头
                            </button>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <h3>拍照与录像</h3>
                        <div class="buttons">
                            <button class="btn btn-primary" id="capturePhoto" disabled>
                                <svg class="camera-icon" viewBox="0 0 24 24">
                                    <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                                    <path d="M20 4h-3.17l-1.24-1.35A1 1 0 0 0 15 2H9a1 1 0 0 0-.59.18L7.17 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-8 13a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
                                </svg>
                                拍照
                            </button>
                            <button class="btn btn-success" id="startRecording" disabled>
                                <svg class="video-icon" viewBox="0 0 24 24">
                                    <path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/>
                                </svg>
                                开始录像
                            </button>
                            <button class="btn btn-danger" id="stopRecording" disabled>
                                <svg class="video-icon" viewBox="0 0 24 24">
                                    <path d="M6 6h12v12H6z"/>
                                </svg>
                                停止录像
                            </button>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <h3>摄像头状态</h3>
                        <div class="status" id="cameraStatus">
                            <div class="status-line info">摄像头未启动</div>
                        </div>
                    </div>
                </div>
                
                <div class="panel">
                    <h2>
                        <svg class="config-icon" viewBox="0 0 24 24">
                            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                        </svg>
                        配置设置
                    </h2>
                    
                    <div class="control-group">
                        <h3>视频配置</h3>
                        <div class="config-controls">
                            <div class="config-item">
                                <label for="width">宽度</label>
                                <input type="number" id="width" value="640" min="160" max="4096">
                            </div>
                            <div class="config-item">
                                <label for="height">高度</label>
                                <input type="number" id="height" value="480" min="120" max="2160">
                            </div>
                            <div class="config-item">
                                <label for="frameRate">帧率</label>
                                <input type="number" id="frameRate" value="30" min="1" max="60">
                            </div>
                            <div class="config-item">
                                <label for="scale">缩放</label>
                                <input type="number" id="scale" value="1.0" min="0.1" max="5" step="0.1">
                            </div>
                        </div>
                        
                        <div class="buttons" style="margin-top: 15px;">
                            <button class="btn btn-primary" id="applyConfig">
                                <svg class="config-icon" viewBox="0 0 24 24">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                                应用配置
                            </button>
                            <button class="btn" id="mirrorMode">
                                <svg class="config-icon" viewBox="0 0 24 24">
                                    <path d="M10 8v8l-6-6 6-6zm4 0v8l6-6-6-6z"/>
                                </svg>
                                镜像模式: 开启
                            </button>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <h3>当前配置</h3>
                        <div class="status" id="configStatus">
                            <div class="status-line info">未获取配置信息</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="right-panel">
                <div class="panel">
                    <h2>
                        <svg class="media-icon" viewBox="0 0 24 24">
                            <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/>
                        </svg>
                        媒体管理
                    </h2>
                    
                    <div class="control-group">
                        <h3>媒体操作</h3>
                        <div class="buttons">
                            <button class="btn btn-primary" id="getMediaList">
                                <svg class="media-icon" viewBox="0 0 24 24">
                                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
                                </svg>
                                获取媒体列表
                            </button>
                            <button class="btn btn-success" id="openMediaManager">
                                <svg class="media-icon" viewBox="0 0 24 24">
                                    <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/>
                                </svg>
                                打开媒体库
                            </button>
                            <button class="btn btn-danger" id="clearAllMedia">
                                <svg class="media-icon" viewBox="0 0 24 24">
                                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                                </svg>
                                清空所有媒体
                            </button>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <h3>存储信息</h3>
                        <div class="status" id="storageInfo">
                            <div class="status-line info">未获取存储信息</div>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <h3>媒体预览</h3>
                        <div class="media-preview" id="mediaPreview">
                            <div class="empty-message">暂无媒体文件</div>
                        </div>
                    </div>
                </div>
                
                <div class="panel">
                    <h2>
                        <svg class="config-icon" viewBox="0 0 24 24">
                            <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 9h-2V5h2v6zm0 4h-2v-2h2v2z"/>
                        </svg>
                        系统日志
                    </h2>
                    
                    <div class="control-group">
                        <div class="status" id="systemLogs">
                            <div class="status-line info">系统日志将显示在这里</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>ISeeU摄像头插件测试页面 &copy; 2023 | 使用前请确保已授予摄像头和麦克风权限</p>
        </div>
    </div>

    <!-- 引入ISeeU插件 -->
    <script src="ISeeU.js"></script>
    
    <script>
        // 全局变量
        let isMirrorMode = true;
        
        // DOM元素
        const startCameraBtn = document.getElementById('startCamera');
        const stopCameraBtn = document.getElementById('stopCamera');
        const switchCameraBtn = document.getElementById('switchCamera');
        const capturePhotoBtn = document.getElementById('capturePhoto');
        const startRecordingBtn = document.getElementById('startRecording');
        const stopRecordingBtn = document.getElementById('stopRecording');
        const applyConfigBtn = document.getElementById('applyConfig');
        const mirrorModeBtn = document.getElementById('mirrorMode');
        const getMediaListBtn = document.getElementById('getMediaList');
        const openMediaManagerBtn = document.getElementById('openMediaManager');
        const clearAllMediaBtn = document.getElementById('clearAllMedia');
        
        const cameraStatus = document.getElementById('cameraStatus');
        const configStatus = document.getElementById('configStatus');
        const storageInfo = document.getElementById('storageInfo');
        const mediaPreview = document.getElementById('mediaPreview');
        const systemLogs = document.getElementById('systemLogs');
        
        // 添加日志
        function addLog(message, type = 'info') {
            const logLine = document.createElement('div');
            logLine.className = `status-line ${type}`;
            logLine.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            systemLogs.appendChild(logLine);
            systemLogs.scrollTop = systemLogs.scrollHeight;
            
            // 限制日志数量
            if (systemLogs.children.length > 50) {
                systemLogs.removeChild(systemLogs.firstChild);
            }
        }
        
        // 更新摄像头状态
        function updateCameraStatus() {
            try {
                const status = window.ISeeU.getCameraStatus();
                cameraStatus.innerHTML = `
                    <div class="status-line ${status.isActive ? 'success' : 'info'}">
                        摄像头状态: ${status.isActive ? '已启动' : '未启动'}
                    </div>
                    <div class="status-line ${status.isRecording ? 'success' : 'info'}">
                        录像状态: ${status.isRecording ? '正在录制' : '未录制'}
                    </div>
                    <div class="status-line info">
                        摄像头类型: ${status.facingMode === 'user' ? '前置' : '后置'}
                    </div>
                    <div class="status-line info">
                        配置: ${status.config.width}x${status.config.height} @ ${status.config.frameRate}fps
                    </div>
                `;
                
                // 更新按钮状态
                startCameraBtn.disabled = status.isActive;
                stopCameraBtn.disabled = !status.isActive;
                switchCameraBtn.disabled = !status.isActive;
                capturePhotoBtn.disabled = !status.isActive;
                startRecordingBtn.disabled = !status.isActive || status.isRecording;
                stopRecordingBtn.disabled = !status.isRecording;
                
            } catch (e) {
                cameraStatus.innerHTML = `<div class="status-line error">获取摄像头状态失败: ${e.message}</div>`;
            }
        }
        
        // 更新配置状态
        function updateConfigStatus() {
            try {
                const config = window.ISeeU.getVideoConfig();
                configStatus.innerHTML = `
                    <div class="status-line info">宽度: ${config.width}</div>
                    <div class="status-line info">高度: ${config.height}</div>
                    <div class="status-line info">帧率: ${config.frameRate}</div>
                    <div class="status-line info">缩放: ${config.scale}</div>
                    <div class="status-line info">镜像模式: ${config.mirror ? '开启' : '关闭'}</div>
                `;
            } catch (e) {
                configStatus.innerHTML = `<div class="status-line error">获取配置失败: ${e.message}</div>`;
            }
        }
        
        // 更新存储信息
        async function updateStorageInfo() {
            try {
                const info = await window.ISeeU.getStorageInfo();
                storageInfo.innerHTML = `
                    <div class="status-line info">总文件数: ${info.totalItems}</div>
                    <div class="status-line info">照片数量: ${info.photos}</div>
                    <div class="status-line info">视频数量: ${info.videos}</div>
                    <div class="status-line info">总大小: ${info.totalSizeFormatted}</div>
                `;
            } catch (e) {
                storageInfo.innerHTML = `<div class="status-line error">获取存储信息失败: ${e.message}</div>`;
            }
        }
        
        // 更新媒体预览
        async function updateMediaPreview() {
            try {
                const mediaList = await window.ISeeU.getMediaList();
                
                if (mediaList.length === 0) {
                    mediaPreview.innerHTML = '<div class="empty-message">暂无媒体文件</div>';
                    return;
                }
                
                mediaPreview.innerHTML = '';
                
                // 只显示最新的6个媒体文件
                const recentMedia = mediaList.slice(0, 6);
                
                recentMedia.forEach(media => {
                    const mediaItem = document.createElement('div');
                    mediaItem.className = 'media-item';
                    
                    const blobUrl = URL.createObjectURL(media.blob);
                    const date = new Date(media.timestamp).toLocaleString();
                    
                    if (media.type === 'photo') {
                        mediaItem.innerHTML = `
                            <img src="${blobUrl}" alt="照片 ${date}" />
                            <div class="media-item-info">
                                ${date}<br>
                                ${formatBytes(media.size)}
                            </div>
                            <div class="media-item-actions">
                                <button class="delete-media" data-id="${media.id}">×</button>
                            </div>
                        `;
                    } else {
                        mediaItem.innerHTML = `
                            <video src="${blobUrl}" preload="metadata"></video>
                            <div class="media-item-info">
                                ${date}<br>
                                ${formatBytes(media.size)}
                            </div>
                            <div class="media-item-actions">
                                <button class="delete-media" data-id="${media.id}">×</button>
                            </div>
                        `;
                    }
                    
                    // 点击预览
                    mediaItem.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('delete-media')) {
                            window.open(blobUrl, '_blank');
                        }
                    });
                    
                    // 删除功能
                    const deleteBtn = mediaItem.querySelector('.delete-media');
                    deleteBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        if (confirm('确定要删除这个文件吗？')) {
                            try {
                                await window.ISeeU.deleteMedia(media.id);
                                URL.revokeObjectURL(blobUrl);
                                addLog(`已删除媒体文件 ID: ${media.id}`, 'success');
                                await updateMediaPreview();
                                await updateStorageInfo();
                            } catch (error) {
                                addLog(`删除媒体文件失败: ${error.message}`, 'error');
                            }
                        }
                    });
                    
                    mediaPreview.appendChild(mediaItem);
                });
                
            } catch (e) {
                mediaPreview.innerHTML = `<div class="empty-message">加载媒体失败: ${e.message}</div>`;
            }
        }
        
        // 格式化字节大小
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }
        
        // 事件监听器
        startCameraBtn.addEventListener('click', async () => {
            try {
                addLog('正在启动摄像头...', 'info');
                await window.ISeeU.startCamera();
                addLog('摄像头启动成功', 'success');
                updateCameraStatus();
            } catch (e) {
                addLog(`摄像头启动失败: ${e.message}`, 'error');
            }
        });
        
        stopCameraBtn.addEventListener('click', () => {
            try {
                window.ISeeU.stopCamera();
                addLog('摄像头已停止', 'info');
                updateCameraStatus();
            } catch (e) {
                addLog(`停止摄像头失败: ${e.message}`, 'error');
            }
        });
        
        switchCameraBtn.addEventListener('click', () => {
            try {
                window.ISeeU.switchCamera();
                addLog('正在切换摄像头...', 'info');
                // 状态会在摄像头重启后自动更新
            } catch (e) {
                addLog(`切换摄像头失败: ${e.message}`, 'error');
            }
        });
        
        capturePhotoBtn.addEventListener('click', () => {
            try {
                window.ISeeU.capturePhoto();
                addLog('已触发拍照', 'success');
                // 稍后更新媒体预览
                setTimeout(updateMediaPreview, 500);
                setTimeout(updateStorageInfo, 500);
            } catch (e) {
                addLog(`拍照失败: ${e.message}`, 'error');
            }
        });
        
        startRecordingBtn.addEventListener('click', async () => {
            try {
                await window.ISeeU.startRecording();
                addLog('开始录像', 'success');
                updateCameraStatus();
            } catch (e) {
                addLog(`开始录像失败: ${e.message}`, 'error');
            }
        });
        
        stopRecordingBtn.addEventListener('click', () => {
            try {
                window.ISeeU.stopRecording();
                addLog('停止录像', 'info');
                // 稍后更新状态和媒体预览
                setTimeout(updateCameraStatus, 500);
                setTimeout(updateMediaPreview, 1000);
                setTimeout(updateStorageInfo, 1000);
            } catch (e) {
                addLog(`停止录像失败: ${e.message}`, 'error');
            }
        });
        
        applyConfigBtn.addEventListener('click', () => {
            try {
                const width = parseInt(document.getElementById('width').value);
                const height = parseInt(document.getElementById('height').value);
                const frameRate = parseInt(document.getElementById('frameRate').value);
                const scale = parseFloat(document.getElementById('scale').value);
                
                window.ISeeU.setVideoConfig({
                    width,
                    height,
                    frameRate,
                    scale,
                    mirror: isMirrorMode
                });
                
                addLog(`已应用配置: ${width}x${height} @ ${frameRate}fps, 缩放: ${scale}, 镜像: ${isMirrorMode ? '开启' : '关闭'}`, 'success');
                updateConfigStatus();
                
                // 如果摄像头正在运行，重新启动以应用配置
                const status = window.ISeeU.getCameraStatus();
                if (status.isActive) {
                    addLog('摄像头正在运行，重新启动以应用新配置...', 'info');
                    window.ISeeU.startCamera();
                }
            } catch (e) {
                addLog(`应用配置失败: ${e.message}`, 'error');
            }
        });
        
        mirrorModeBtn.addEventListener('click', () => {
            isMirrorMode = !isMirrorMode;
            mirrorModeBtn.textContent = `镜像模式: ${isMirrorMode ? '开启' : '关闭'}`;
            mirrorModeBtn.innerHTML = `
                <svg class="config-icon" viewBox="0 0 24 24">
                    <path d="M10 8v8l-6-6 6-6zm4 0v8l6-6-6-6z"/>
                </svg>
                镜像模式: ${isMirrorMode ? '开启' : '关闭'}
            `;
            
            try {
                window.ISeeU.setMirrorMode(isMirrorMode);
                addLog(`镜像模式已${isMirrorMode ? '开启' : '关闭'}`, 'success');
                updateConfigStatus();
            } catch (e) {
                addLog(`设置镜像模式失败: ${e.message}`, 'error');
            }
        });
        
        getMediaListBtn.addEventListener('click', async () => {
            try {
                addLog('正在获取媒体列表...', 'info');
                await updateMediaPreview();
                await updateStorageInfo();
                addLog('媒体列表获取成功', 'success');
            } catch (e) {
                addLog(`获取媒体列表失败: ${e.message}`, 'error');
            }
        });
        
        openMediaManagerBtn.addEventListener('click', () => {
            try {
                window.ISeeU.openMediaManager();
                addLog('已打开媒体库', 'success');
            } catch (e) {
                addLog(`打开媒体库失败: ${e.message}`, 'error');
            }
        });
        
        clearAllMediaBtn.addEventListener('click', async () => {
            if (confirm('确定要清空所有媒体文件吗？此操作不可撤销！')) {
                try {
                    addLog('正在清空所有媒体文件...', 'info');
                    await window.ISeeU.clearAllMedia();
                    addLog('所有媒体文件已清空', 'success');
                    await updateMediaPreview();
                    await updateStorageInfo();
                } catch (e) {
                    addLog(`清空媒体文件失败: ${e.message}`, 'error');
                }
            }
        });
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            addLog('ISeeU测试页面已加载', 'success');
            updateConfigStatus();
            updateStorageInfo();
            
            // 定期更新摄像头状态
            setInterval(updateCameraStatus, 1000);
        });
    </script>
</body>
</html>
