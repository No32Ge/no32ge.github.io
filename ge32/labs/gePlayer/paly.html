<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelRenderer Mic Visualizer</title>
<style>
body { background:#000; color:#0f0; font-family:monospace; text-align:center; }
canvas { border:1px solid #333; margin-top:20px; image-rendering:pixelated; }
button { background:#111; color:#0f0; border:1px solid #0f0; padding:6px 12px; cursor:pointer; }
</style>
</head>
<body>
<h2>🎤 实时音频 → 像素可视化</h2>
<button id="startBtn">启动麦克风</button>
<br>
<canvas id="cvs" width="256" height="128"></canvas>

<script type="module">
// ================= PixelRenderer ==================
class PixelRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d", {alpha:false});
    this.width = canvas.width;
    this.height = canvas.height;
    this.scale = 1;
  }

  renderSpectrum(frequencyData) {
    const ctx = this.ctx;
    ctx.fillStyle = "black";
    ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
    const barWidth = this.canvas.width / frequencyData.length;
    for (let i=0;i<frequencyData.length;i++) {
      const value = frequencyData[i]/255;
      const barHeight = value * this.canvas.height;
      const y = this.canvas.height - barHeight;
      const color = `rgb(${Math.floor(255*value)},${Math.floor(255*(1-value))},50)`;
      ctx.fillStyle = color;
      ctx.fillRect(i*barWidth, y, barWidth, barHeight);
    }
  }
}

// ================= Main ==================
const canvas = document.getElementById('cvs');
const renderer = new PixelRenderer(canvas);
const btn = document.getElementById('startBtn');
let audioCtx, analyser, dataArray;

btn.onclick = async ()=>{
  btn.disabled = true;
  btn.textContent = "麦克风已启动";
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  source.connect(analyser);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  loop();
};

function loop(){
  requestAnimationFrame(loop);
  if (!analyser) return;
  analyser.getByteFrequencyData(dataArray);
  renderer.renderSpectrum(dataArray);
}
</script>
</body>
</html>
